name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions pinned by commit SHA (supply-chain policy, spec/SECURITY_AND_PRIVACY.md A3).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # third_party/vss is not needed for checks; skip the large submodule.
          submodules: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Sync workspace (locked)
        run: uv sync --locked

      - name: Pre-commit hooks (hygiene, ruff, lock check, mypy)
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

      - name: Tests
        run: uv run --frozen pytest
